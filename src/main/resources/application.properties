spring.application.name=SeatRush

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seatrush_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3VyZVNlYXRSdXNoSldUS2V5MjAyNlZlcnlMb25nQW5kU2VjdXJl}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000


# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000